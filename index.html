<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pas mladého záchranára / Ifjú megmentő útlevél</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: rgba(23, 37, 84, 0.85);
      --card-border: rgba(96, 165, 250, 0.25);
      --fire-red: #ef4444;
      --med-green: #10b981;
      --pol-blue: #3b82f6;
      --gold: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b1329 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
    }
    header {
      padding: 16px;
      text-align: center;
      background: rgba(11, 19, 41, 0.95);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .lang-switcher {
      display: flex;
      gap: 6px;
      background: #0f172a;
      padding: 4px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 14px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--gold);
      color: #0b1329;
    }
    h1 { font-size: 1.3rem; font-weight: 900; }
    .badge-sub {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
    }
    .container { max-width: 560px; margin: 0 auto; padding: 16px; }

    /* TAJNIČKA */
    .word-tracker {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
    }
    .word-tracker h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .slots {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .slot {
      width: 44px;
      height: 52px;
      background: #1e293b;
      border: 2px dashed #475569;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--gold);
    }
    .slot.unlocked {
      background: #0f172a;
      border: 2px solid var(--gold);
      color: #fbbf24;
    }

    /* KARTY */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card.fire { border-left: 5px solid var(--fire-red); }
    .card.med { border-left: 5px solid var(--med-green); }
    .card.pol { border-left: 5px solid var(--pol-blue); }

    .card.unlocked-card {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.5);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .station-number {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }
    .hero-tag {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .hero-tag.fire { color: #f87171; }
    .hero-tag.med { color: #34d399; }
    .hero-tag.pol { color: #60a5fa; }

    .card-title { font-size: 1.05rem; font-weight: 800; }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

    .hero-img-box {
      width: 100%;
      height: 180px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 4px 0;
    }
    .hero-img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .card-bottom {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .unlock-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    .unlock-btn:hover { background: #2563eb; }

    .fact-btn {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .unlocked-tag {
      color: #34d399;
      font-weight: 800;
      font-size: 0.9rem;
    }

    /* VÍŤAZNÝ BOX */
    #victory-screen {
      display: none;
      margin-bottom: 24px;
      background: #1e293b;
      border: 2px solid var(--gold);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
    }

    /* MODALE */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      text-align: center;
    }
    .modal input {
      width: 100%;
      padding: 12px;
      font-size: 1.6rem;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      border-radius: 12px;
      border: 2px solid #475569;
      background: #0f172a;
      color: white;
      margin: 16px 0;
      outline: none;
    }
    .modal-actions { display: flex; gap: 10px; }
    .btn-secondary {
      flex: 1;
      background: #334155;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary {
      flex: 1;
      background: var(--gold);
      color: #0b1329;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .fact-icon { font-size: 3rem; margin-bottom: 8px; }
    .fact-title { font-size: 1.15rem; font-weight: bold; color: var(--gold); margin-bottom: 12px; }
    .fact-text {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #e2e8f0;
      text-align: left;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <header>
    <div class="lang-switcher">
      <button type="button" class="lang-btn active" id="btn-sk" onclick="changeLang('sk')">🇸🇰 Slovenčina</button>
      <button type="button" class="lang-btn" id="btn-hu" onclick="changeLang('hu')">🇭🇺 Magyar</button>
    </div>
    <h1 id="txt-title">PAS MLADÉHO ZÁCHRANÁRA</h1>
    <div class="badge-sub" id="txt-subtitle">Pátracia akcia v obci</div>
  </header>

  <div class="container">
    <div class="word-tracker">
      <h2 id="txt-tracker-title">Získaj tajničku: H - R - D - I - N - A</h2>
      <div class="slots">
        <div class="slot" id="slot-0">?</div>
        <div class="slot" id="slot-1">?</div>
        <div class="slot" id="slot-2">?</div>
        <div class="slot" id="slot-3">?</div>
        <div class="slot" id="slot-4">?</div>
        <div class="slot" id="slot-5">?</div>
      </div>
    </div>

    <!-- DIPLOM BOX -->
    <div id="victory-screen">
      <div style="font-size: 3rem;">🎖️</div>
      <h3 style="font-size: 1.3rem; color: var(--gold); margin-top: 8px;" id="txt-cert-title">VŠETKY KÓDY NÁJDENÉ!</h3>
      <p style="margin: 10px 0; color: var(--text-muted); font-size: 0.9rem;" id="txt-cert-desc">
        Úspešne si odhalil tajničku a zvládol celú trasu!
      </p>
      <input type="text" id="hero-name" placeholder="Zadaj svoje meno" style="padding: 10px; border-radius: 10px; width: 85%; background: #0f172a; border: 1px solid #475569; color: white; text-align: center; margin-bottom: 12px; font-size: 1rem;">
      <br>
      <button type="button" class="btn-primary" onclick="generateDiploma()" id="txt-cert-btn">🎖️ Zobraziť a vytlačiť diplom</button>
    </div>

    <!-- KARTY -->
    <div class="grid" id="stations-grid"></div>
  </div>

  <!-- MODAL: KÓD -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 style="font-size: 1.1rem; font-weight: bold;" id="txt-modal-title">Zadaj kód z krabičky</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;" id="modal-station-title"></p>
      <input type="text" id="code-input" maxlength="2" placeholder="PÍSMENO / BETŰ" autocomplete="off">
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="txt-modal-cancel" onclick="closeInputModal()">Zrušiť</button>
        <button type="button" class="btn-primary" id="txt-modal-confirm" onclick="verifyCode()">Potvrdiť</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ZAUJÍMAVOSŤ -->
  <div class="modal-overlay" id="fact-modal">
    <div class="modal">
      <div class="fact-icon" id="fact-icon">🔥</div>
      <div class="fact-title" id="fact-title"></div>
      <div class="fact-text" id="fact-desc"></div>
      <button type="button" class="btn-primary" style="width: 100%;" id="fact-close-btn" onclick="closeFactModal()">Zavrieť</button>
    </div>
  </div>

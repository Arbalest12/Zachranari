<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Virtuálny pas mladého záchranára / Ifjú megmentő virtuális útlevél</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: rgba(23, 37, 84, 0.7);
      --card-border: rgba(96, 165, 250, 0.2);
      --fire-red: #ef4444;
      --med-green: #10b981;
      --pol-blue: #3b82f6;
      --gold: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b1329 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
    }
    header {
      padding: 16px;
      text-align: center;
      background: rgba(11, 19, 41, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .lang-switcher {
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: var(--gold);
      color: #0b1329;
    }
    h1 { font-size: 1.25rem; font-weight: 900; letter-spacing: -0.02em; }
    .badge-sub {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
    }
    .container { max-width: 560px; margin: 0 auto; padding: 16px; }

    /* SECRET WORD SLOTS */
    .word-tracker {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .word-tracker h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .slots {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .slot {
      width: 44px;
      height: 52px;
      background: #1e293b;
      border: 2px dashed #475569;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--gold);
      transition: all 0.3s ease;
    }
    .slot.unlocked {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--gold);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.6); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* GRID OF CARDS */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(8px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card.fire { border-left: 5px solid var(--fire-red); }
    .card.med { border-left: 5px solid var(--med-green); }
    .card.pol { border-left: 5px solid var(--pol-blue); }

    .card.unlocked-card {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .station-number {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }
    .hero-tag {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .hero-tag.fire { color: #f87171; }
    .hero-tag.med { color: #34d399; }
    .hero-tag.pol { color: #60a5fa; }

    .card-title {
      font-size: 1.05rem;
      font-weight: 800;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .unlock-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .unlock-btn:active { transform: scale(0.98); }
    .unlocked-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #34d399;
      font-weight: 800;
      font-size: 0.9rem;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      text-align: center;
    }
    .modal input {
      width: 100%;
      padding: 14px;
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
      border-radius: 12px;
      border: 2px solid #475569;
      background: #0f172a;
      color: white;
      margin: 16px 0;
      outline: none;
    }
    .modal input:focus { border-color: var(--gold); }
    .modal-actions {
      display: flex;
      gap: 10px;
    }
    .btn-secondary {
      flex: 1;
      background: #334155;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary {
      flex: 1;
      background: var(--gold);
      color: #0b1329;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* DIPLOM */
    #victory-screen {
      display: none;
      margin-top: 24px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--gold);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.25);
    }
    .cert-icon { font-size: 3rem; margin-bottom: 8px; }
    .cert-title { font-size: 1.3rem; font-weight: 900; color: var(--gold); }
    .cert-input {
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      padding: 10px;
      border-radius: 10px;
      font-size: 1rem;
      width: 80%;
      margin: 12px 0;
      text-align: center;
    }
    .print-btn {
      background: var(--gold);
      color: #0b1329;
      font-weight: 800;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-sk" onclick="setLang('sk')">🇸🇰 Slovenčina</button>
      <button class="lang-btn" id="btn-hu" onclick="setLang('hu')">🇭🇺 Magyar</button>
    </div>
    <h1 id="txt-title">PAS MLADÉHO ZÁCHRANÁRA</h1>
    <div class="badge-sub" id="txt-subtitle">Pátracia akcia v obci</div>
  </header>

  <div class="container">

    <!-- TAJNIČKA -->
    <div class="word-tracker">
      <h2 id="txt-tracker-title">Získaj písmená tajničky (6 krabičiek)</h2>
      <div class="slots">
        <div class="slot" id="slot-0">?</div>
        <div class="slot" id="slot-1">?</div>
        <div class="slot" id="slot-2">?</div>
        <div class="slot" id="slot-3">?</div>
        <div class="slot" id="slot-4">?</div>
        <div class="slot" id="slot-5">?</div>
      </div>
    </div>

    <!-- DIPLOM PO DOKONČENÍ -->
    <div id="victory-screen">
      <div class="cert-icon">🎖️</div>
      <div class="cert-title" id="txt-cert-title">VŠETKY KÓDY NÁJDENÉ!</div>
      <p style="margin-top: 8px; color: var(--text-muted); font-size: 0.9rem;" id="txt-cert-desc">
        Úspešne si odhalil tajničku <strong>HRDINA</strong> a zvládol celú záchranársku trasu!
      </p>
      <input type="text" id="hero-name" class="cert-input" placeholder="Zadaj svoje meno">
      <br>
      <button class="print-btn" id="txt-cert-btn" onclick="window.print()">Vytlačiť / Uložiť diplom</button>
    </div>

    <!-- ZOZNAM STANOVÍŠŤ -->
    <div class="grid" id="stations-grid" style="margin-top: 20px;">
      <!-- Generuje JS -->
    </div>

  </div>

  <!-- MODAL NA ZADANIE KÓDU -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 style="font-size: 1.1rem; font-weight: 800;" id="txt-modal-title">Zadaj kód z krabičky</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;" id="modal-station-title">Stanovište</p>
      <input type="text" id="code-input" maxlength="2" placeholder="PÍSMENO" autocomplete="off">
      <div class="modal-actions">
        <button class="btn-secondary" id="txt-modal-cancel" onclick="closeModal()">Zrušiť</button>
        <button class="btn-primary" id="txt-modal-confirm" onclick="submitCode()">Potvrdiť</button>
      </div>
    </div>
  </div>

  <script>
    const I18N = {
      sk: {
        title: "PAS MLADÉHO ZÁCHRANÁRA",
        subtitle: "Pátracia akcia v obci",
        trackerTitle: "Získaj písmená tajničky (6 krabičiek)",
        station: "Stanovište",
        unlockedTag: "✓ Odomknuté písmeno",
        btnUnlock: "Zadať kód z krabičky",
        modalTitle: "Zadaj kód z krabičky",
        modalPlaceholder: "PÍSMENO",
        modalCancel: "Zrušiť",
        modalConfirm: "Potvrdiť",
        wrongCode: "Nesprávny kód. Pozri sa lepšie na krabičku!",
        certTitle: "VŠETKY KÓDY NÁJDENÉ!",
        certDesc: "Úspešne si odhalil tajničku <strong>HRDINA</strong> a zvládol celú záchranársku trasu!",
        certPlaceholder: "Zadaj svoje meno",
        certBtn: "Vytlačiť / Uložiť diplom",
        heroes: {
          fire: "Hasič Redi",
          med: "Záchranárka Eli",
          pol: "Policajt Rocky"
        },
        stations: [
          { title: "Hasičské stanovište #1", hint: "Hľadaj pri hasičskej zbrojnici alebo v parku." },
          { title: "Hasičské stanovište #2", hint: "Hľadaj pri zdroji vody alebo oddychovej zóne." },
          { title: "Záchranárske stanovište #1", hint: "Hľadaj v blízkosti zdravotného strediska alebo lekárne." },
          { title: "Záchranárske stanovište #2", hint: "Hľadaj pri športovom areáli alebo detskom ihrisku." },
          { title: "Policajné stanovište #1", hint: "Hľadaj pri bezpečnom priechode pre chodcov." },
          { title: "Policajné stanovište #2", hint: "Hľadaj pri obecnom úrade alebo kultúrnom dome." }
        ]
      },
      hu: {
        title: "IFJÚ MEGMENTŐ ÚTLEVÉL",
        subtitle: "Községi nyomozós kaland",
        trackerTitle: "Gyűjtsd össze a rejtvény betűit (6 doboz)",
        station: "Állomás",
        unlockedTag: "✓ Feloldott betű",
        btnUnlock: "Kód megadása a dobozról",
        modalTitle: "Add meg a kódot a dobozról",
        modalPlaceholder: "BETŰ",
        modalCancel: "Mégse",
        modalConfirm: "Jóváhagy",
        wrongCode: "Helytelen kód. Nézd meg jobban a dobozt!",
        certTitle: "MINDEN KÓD MEGTALÁLVA!",
        certDesc: "Sikeresen megfejtetted a <strong>HRDINA</strong> (Hős) szót és teljesítetted az útvonalat!",
        certPlaceholder: "Írd be a neved",
        certBtn: "Oklevél letöltése / nyomtatása",
        heroes: {
          fire: "Redi, a tűzoltó",
          med: "Eli, a mentős",
          pol: "Rocky, a rendőr"
        },
        stations: [
          { title: "Tűzoltó állomás #1", hint: "Keresd a tűzoltószertárnál vagy a parkban." },
          { title: "Tűzoltó állomás #2", hint: "Keresd a vízparton vagy a pihenőövezetben." },
          { title: "Mentős állomás #1", hint: "Keresd az orvosi rendelő vagy a gyógyszertár közelében." },
          { title: "Mentős állomás #2", hint: "Keresd a sportpályánál vagy a játszótérnél." },
          { title: "Rendőrségi állomás #1", hint: "Keresd a biztonságos gyalogátkelőnél." },
          { title: "Rendőrségi állomás #2", hint: "Keresd a községi hivatalnál vagy a kultúrháznál." }
        ]
      }
    };

    const STATIONS = [
      { id: 1, letter: 'H', index: 0, role: 'fire' },
      { id: 2, letter: 'R', index: 1, role: 'fire' },
      { id: 3, letter: 'D', index: 2, role: 'med' },
      { id: 4, letter: 'I', index: 3, role: 'med' },
      { id: 5, letter: 'N', index: 4, role: 'pol' },
      { id: 6, letter: 'A', index: 5, role: 'pol' }
    ];

    let currentLang = localStorage.getItem('pas_lang') || 'sk';
    let unlocked = JSON.parse(localStorage.getItem('unlocked_stations') || '[]');
    let currentModalStation = null;

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('pas_lang', lang);
      document.getElementById('btn-sk').classList.toggle('active', lang === 'sk');
      document.getElementById('btn-hu').classList.toggle('active', lang === 'hu');
      render();
    }

    function init() {
      const params = new URLSearchParams(window.location.search);
      const stampParam = params.get('stamp');
      const codeParam = params.get('kod');

      if (stampParam) {
        const found = STATIONS.find(s => s.id == stampParam);
        if (found && !unlocked.includes(found.id)) unlockStation(found.id);
      } else if (codeParam) {
        const found = STATIONS.find(s => s.letter.toLowerCase() == codeParam.toLowerCase());
        if (found && !unlocked.includes(found.id)) unlockStation(found.id);
      }

      setLang(currentLang);
    }

    function render() {
      const t = I18N[currentLang];

      // Hlavné statické texty

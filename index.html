<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pas mladého záchranára / Ifjú megmentő útlevél</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: rgba(23, 37, 84, 0.85);
      --card-border: rgba(96, 165, 250, 0.25);
      --fire-red: #ef4444;
      --med-green: #10b981;
      --pol-blue: #3b82f6;
      --gold: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b1329 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
    }
    header {
      padding: 16px;
      text-align: center;
      background: rgba(11, 19, 41, 0.95);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .lang-switcher {
      display: flex;
      gap: 6px;
      background: #0f172a;
      padding: 4px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 14px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--gold);
      color: #0b1329;
    }
    h1 { font-size: 1.3rem; font-weight: 900; }
    .badge-sub {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
    }
    .container { max-width: 560px; margin: 0 auto; padding: 16px; }

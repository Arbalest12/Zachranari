<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pas mladého záchranára / Ifjú megmentő útlevél</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: rgba(23, 37, 84, 0.85);
      --card-border: rgba(96, 165, 250, 0.25);
      --fire-red: #ef4444;
      --med-green: #10b981;
      --pol-blue: #3b82f6;
      --gold: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b1329 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
    }
    header {
      padding: 16px;
      text-align: center;
      background: rgba(11, 19, 41, 0.95);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .lang-switcher {
      display: flex;
      gap: 6px;
      background: #0f172a;
      padding: 4px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 14px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--gold);
      color: #0b1329;
    }
    h1 { font-size: 1.3rem; font-weight: 900; }
    .badge-sub {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
    }
    .container { max-width: 560px; margin: 0 auto; padding: 16px; }

    /* TAJNIČKA */
    .word-tracker {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
    }
    .word-tracker h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .slots {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .slot {
      width: 44px;
      height: 52px;
      background: #1e293b;
      border: 2px dashed #475569;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--gold);
    }
    .slot.unlocked {
      background: #0f172a;
      border: 2px solid var(--gold);
      color: #fbbf24;
    }

    /* KARTY */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card.fire { border-left: 5px solid var(--fire-red); }
    .card.med { border-left: 5px solid var(--med-green); }
    .card.pol { border-left: 5px solid var(--pol-blue); }

    .card.unlocked-card {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.5);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .station-number {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }
    .hero-tag {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .hero-tag.fire { color: #f87171; }
    .hero-tag.med { color: #34d399; }
    .hero-tag.pol { color: #60a5fa; }

    .card-title { font-size: 1.05rem; font-weight: 800; }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

    .card-bottom {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .unlock-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    .unlock-btn:hover { background: #2563eb; }

    .fact-btn {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .unlocked-tag {
      color: #34d399;
      font-weight: 800;
      font-size: 0.9rem;
    }

    /* MODALE */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      text-align: center;
    }
    .modal input {
      width: 100%;
      padding: 12px;
      font-size: 1.6rem;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      border-radius: 12px;
      border: 2px solid #475569;
      background: #0f172a;
      color: white;
      margin: 16px 0;
      outline: none;
    }
    .modal-actions { display: flex; gap: 10px; }
    .btn-secondary {
      flex: 1;
      background: #334155;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary {
      flex: 1;
      background: var(--gold);
      color: #0b1329;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .fact-icon { font-size: 3rem; margin-bottom: 8px; }
    .fact-title { font-size: 1.15rem; font-weight: bold; color: var(--gold); margin-bottom: 12px; }
    .fact-text {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #e2e8f0;
      text-align: left;
      margin-bottom: 16px;
    }

    #victory-screen {
      display: none;
      margin-bottom: 24px;
      background: #1e293b;
      border: 2px solid var(--gold);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="lang-switcher">
      <button type="button" class="lang-btn active" id="btn-sk" onclick="changeLang('sk')">🇸🇰 Slovenčina</button>
      <button type="button" class="lang-btn" id="btn-hu" onclick="changeLang('hu')">🇭🇺 Magyar</button>
    </div>
    <h1 id="txt-title">PAS MLADÉHO ZÁCHRANÁRA</h1>
    <div class="badge-sub" id="txt-subtitle">Pátracia akcia v obci</div>
  </header>

  <div class="container">
    <div class="word-tracker">
      <h2 id="txt-tracker-title">Získaj písmená tajničky (6 krabičiek)</h2>
      <div class="slots">
        <div class="slot" id="slot-0">?</div>
        <div class="slot" id="slot-1">?</div>
        <div class="slot" id="slot-2">?</div>
        <div class="slot" id="slot-3">?</div>
        <div class="slot" id="slot-4">?</div>
        <div class="slot" id="slot-5">?</div>
      </div>
    </div>

    <div id="victory-screen">
      <div style="font-size: 3rem;">🎖️</div>
      <h3 style="font-size: 1.3rem; color: var(--gold); margin-top: 8px;" id="txt-cert-title">VŠETKY KÓDY NÁJDENÉ!</h3>
      <p style="margin: 10px 0; color: var(--text-muted); font-size: 0.9rem;" id="txt-cert-desc">
        Úspešne si odhalil tajničku a zvládol celú trasu!
      </p>
      <input type="text" id="hero-name" placeholder="Zadaj svoje meno" style="padding: 10px; border-radius: 10px; width: 80%; background: #0f172a; border: 1px solid #475569; color: white; text-align: center; margin-bottom: 12px;">
      <br>
      <button type="button" class="btn-primary" onclick="window.print()" id="txt-cert-btn">Vytlačiť diplom</button>
    </div>

    <div class="grid" id="stations-grid"></div>
  </div>

  <!-- MODAL: KOD -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 style="font-size: 1.1rem; font-weight: bold;" id="txt-modal-title">Zadaj kód z krabičky</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;" id="modal-station-title"></p>
      <input type="text" id="code-input" maxlength="2" placeholder="PÍSMENO / BETŰ" autocomplete="off">
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="txt-modal-cancel" onclick="closeInputModal()">Zrušiť</button>
        <button type="button" class="btn-primary" id="txt-modal-confirm" onclick="verifyCode()">Potvrdiť</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ZAUJÍMAVOSŤ -->
  <div class="modal-overlay" id="fact-modal">
    <div class="modal">
      <div class="fact-icon" id="fact-icon">🔥</div>
      <div class="fact-title" id="fact-title"></div>
      <div class="fact-text" id="fact-desc"></div>
      <button type="button" class="btn-primary" style="width: 100%;" id="fact-close-btn" onclick="closeFactModal()">Zavrieť</button>
    </div>
  </div>

  <script>
    var I18N = {
      sk: {
        title: "PAS MLADÉHO ZÁCHRANÁRA",
        subtitle: "Pátracia akcia v obci",
        trackerTitle: "Získaj tajničku: H - R - D - I - N - A",
        station: "Stanovište",
        unlockedTag: "✓ Písmeno",
        btnUnlock: "Zadať kód z krabičky",
        btnReadFact: "💡 Zaujímavosť",
        modalTitle: "Zadaj kód z krabičky",
        modalCancel: "Zrušiť",
        modalConfirm: "Potvrdiť",
        wrongCode: "Nesprávny kód. Pozri sa lepšie na krabičku!",
        certTitle: "VŠETKY KÓDY NÁJDENÉ!",
        certDesc: "Úspešne si odhalil tajničku <strong>HRDINA</strong> a zvládol celú záchranársku trasu!",
        certPlaceholder: "Zadaj svoje meno",
        certBtn: "Vytlačiť diplom",
        factClose: "Rozumiem",
        heroes: { fire: "Hasič Redi", med: "Záchranárka Eli", pol: "Policajt Rocky" },
        stations: [
          { title: "Hasičské stanovište #1", hint: "Hľadaj pri hasičskej zbrojnici alebo v parku.", factTitle: "Redi radí: Číslo 150 a oheň", factText: "Vedel si, že hasičské auto vezie tisíce litrov vody? Číslo 150 si zapamätáš ľahko – nula na konci pripomína stočenú hadicu!" },
          { title: "Hasičské stanovište #2", hint: "Hľadaj pri zdroji vody alebo oddychovej zóne.", factTitle: "Redi radí: Bezpečný oheň", factText: "Suchá tráva a lístie vzbĺknu za sekundu. Skutočný záchranár v prírode nezakladá oheň mimo vyznačených ohnísk a vždy ho zaleje vodou." },
          { title: "Záchranárske stanovište #1", hint: "Hľadaj pri zdravotnom stredisku alebo lekárni.", factTitle: "Eli radí: Číslo 155 a prvá pomoc", factText: "Číslo 155 voláme, ak je niekto ťažko zranený. Päťka na konci pripomína invalidný vozík. Pri odretom kolene však najviac pomôže čistá voda a náplasť." },
          { title: "Záchranárske stanovište #2", hint: "Hľadaj pri športovom areáli alebo detskom ihrisku.", factTitle: "Eli radí: Bezpečnosť pri športe", factText: "Pri bicyklovaní chráni prilba tvoj najcennejší poklad – hlavu. Nezabúdaj piť čistú vodu, aby ti nechýbala energia!" },
          { title: "Policajné stanovište #1", hint: "Hľadaj pri bezpečnom priechode pre chodcov.", factTitle: "Rocky radí: Vidieť a byť videný", factText: "Reflexný prvok na taške ti v tme zachráni život! Vodič ťa zbadá z oveľa väčšej vzdialenosti. Cez cestu prechádzaj vždy po zebre." },
          { title: "Policajné stanovište #2", hint: "Hľadaj pri obecnom úrade alebo kultúrnom dome.", factTitle: "Rocky radí: Číslo 158 a linka 112", factText: "Číslo 158 končí osmičkou, ktorá pripomína putá. V celej Európe funguje aj univerzálne číslo 112 pre všetky zložky naraz." }
        ]
      },
      hu: {
        title: "IFJÚ MEGMENTŐ ÚTLEVÉL",
        subtitle: "Községi nyomozós kaland",
        trackerTitle: "Gyűjtsd össze a szót: B - Á - T - O - R - !",
        station: "Állomás",
        unlockedTag: "✓ Betű",
        btnUnlock: "Kód megadása a dobozról",
        btnReadFact: "💡 Érdekesség",
        modalTitle: "Add meg a kódot a dobozról",
        modalCancel: "Mégse",
        modalConfirm: "Jóváhagy",
        wrongCode: "Helytelen kód. Nézd meg jobban a dobozt!",
        certTitle: "MINDEN KÓD MEGTALÁLVA!",
        certDesc: "Sikeresen megfejtetted a <strong>BÁTOR!</strong> szót és teljesítetted az útvonalat!",
        certPlaceholder: "Írd be a neved",
        certBtn: "Oklevél kinyomtatása",
        factClose: "Megértettem",
        heroes: { fire: "Redi, a tűzoltó", med: "Eli, a mentős", pol: "Rocky, a rendőr" },
        stations: [
          { title: "Tűzoltó állomás #1", hint: "Keresd a tűzoltószertárnál vagy a parkban.", factTitle: "Redi tanácsa: A 150-es szám és a tűz", factText: "Tudtad, hogy a tűzoltóautó több ezer liter vizet szállít magával? A 150-es szám végén lévő nulla egy feltekert tömlőre emlékeztet!" },
          { title: "Tűzoltó állomás #2", hint: "Keresd a vízparton vagy a pihenőövezetben.", factTitle: "Redi tanácsa: Tűzgyújtási tilalom", factText: "A száraz fű pillanatok alatt lángra kap. Egy igazi megmentő soha nem gyújt tüzet a kijelölt helyeken kívül!" },
          { title: "Mentős állomás #1", hint: "Keresd az orvosi rendelő vagy a gyógyszertár közelében.", factTitle: "Eli tanácsa: A 155-ös szám", factText: "A 155-öt akkor hívjuk, ha valaki súlyosan megsérült. Egy horzsolt térdnél viszont a tiszta víz és a sebtapasz a legjobb segítség." },
          { title: "Mentős állomás #2", hint: "Keresd a sportpályánál vagy a játszótérnél.", factTitle: "Eli tanácsa: Bukósisak és víz", factText: "Amikor biciklizel, a sisak a legféltettebb kincsedet – a fejedet védi. Mindig igyál elég vizet a mozgás közben!" },
          { title: "Rendőrségi állomás #1", hint: "Keresd a biztonságos gyalogátkelőnél.", factTitle: "Rocky tanácsa: Látni és látszani", factText: "Egy fényvisszaverő a táskádon a sötétben életet menthet! A sofőr jóval messzebbről észrevesz az úton." },
          { title: "Rendőrségi állomás #2", hint: "Keresd a községi hivatalnál vagy a kultúrháznál.", factTitle: "Rocky tanácsa: A 158-as és a 112-es szám", factText: "A rendőrség 158-as száma a bilincsre emlékeztet. A 112-es közös segélyhívó pedig egész Európában elérhető." }
        ]
      }
    };

    // Písmená pre SK aj HU a povolené vstupy pre každú krabičku
    var STATIONS = [
      { id: 1, skLetter: 'H', huLetter: 'B', validKeys: ['H', 'B'], index: 0, role: 'fire' },
      { id: 2, skLetter: 'R', huLetter: 'Á', validKeys: ['R', 'Á', 'A'], index: 1, role: 'fire' },
      { id: 3, skLetter: 'D', huLetter: 'T', validKeys: ['D', 'T'], index: 2, role: 'med' },
      { id: 4, skLetter: 'I', huLetter: 'O', validKeys: ['I', 'O', 'Ó'], index: 3, role: 'med' },
      { id: 5, skLetter: 'N', huLetter: 'R', validKeys: ['N', 'R'], index: 4, role: 'pol' },
      { id: 6, skLetter: 'A', huLetter: '!', validKeys: ['A', '!'], index: 5, role: 'pol' }
    ];

    var currentLang = 'sk';
    var unlocked = [];
    var activeStation = null;

    try {
      var savedLang = localStorage.getItem('pas_lang');
      if (savedLang) currentLang = savedLang;
      var savedUnlocked = localStorage.getItem('unlocked_stations');
      if (savedUnlocked) unlocked = JSON.parse(savedUnlocked);
    } catch(e) {}

    function changeLang(lang) {
      currentLang = lang;
      try { localStorage.setItem('pas_lang', lang); } catch(e) {}
      document.getElementById('btn-sk').className = 'lang-btn' + (lang === 'sk' ? ' active' : '');
      document.getElementById('btn-hu').className = 'lang-btn' + (lang === 'hu' ? ' active' : '');
      renderAll();
    }

    function renderAll() {
      var t = I18N[currentLang] || I18N.sk;

      document.getElementById('txt-title').textContent = t.title;
      document.getElementById('txt-subtitle').textContent = t.subtitle;
      document.getElementById('txt-tracker-title').textContent = t.trackerTitle;
      document.getElementById('txt-cert-title').textContent = t.certTitle;
      document.getElementById('txt-cert-desc').innerHTML = t.certDesc;
      document.getElementById('hero-name').placeholder = t.certPlaceholder;
      document.getElementById('txt-cert-btn').textContent = t.certBtn;
      document.getElementById('txt-modal-title').textContent = t.modalTitle;
      document.getElementById('txt-modal-cancel').textContent = t.modalCancel;
      document.getElementById('txt-modal-confirm').textContent = t.modalConfirm;
      document.getElementById('fact-close-btn').textContent = t.factClose;

      // Hasło / Tajnička podľa jazyka
      for (var i = 0; i < STATIONS.length; i++) {
        var s = STATIONS[i];
        var letterToShow = (currentLang === 'hu') ? s.huLetter : s.skLetter;
        var slot = document.getElementById('slot-' + s.index);
        if (slot) {
          if (unlocked.indexOf(s.id) !== -1) {
            slot.textContent = letterToShow;
            slot.className = 'slot unlocked';
          } else {
            slot.textContent = '?';
            slot.className = 'slot';
          }
        }
      }

      // Karty stanovišť
      var grid = document.getElementById('stations-grid');
      grid.innerHTML = '';

      for (var j = 0; j < STATIONS.length; j++) {
        var st = STATIONS[j];
        var isDone = unlocked.indexOf(st.id) !== -1;
        var stData = t.stations[j];
        var heroName = t.heroes[st.role];
        var currentLetter = (currentLang === 'hu') ? st.huLetter : st.skLetter;

        var card = document.createElement('div');
        card.className = 'card ' + st.role + (isDone ? ' unlocked-card' : '');

        var btnHtml = isDone 
          ? '<div class="unlocked-tag">' + t.unlockedTag + ' <strong>' + currentLetter + '</strong></div>' +
            '<button type="button" class="fact-btn" onclick="openFactModal(' + st.id + ')">' + t.btnReadFact + '</button>'
          : '<button type="button" class="unlock-btn" onclick="openInputModal(' + st.id + ')">' + t.btnUnlock + '</button>';

        card.innerHTML = 
          '<div class="card-head">' +
            '<span class="station-number">' + t.station + ' #' + st.id + '</span>' +
            '<span class="hero-tag ' + st.role + '">' + heroName + '</span>' +
          '</div>' +
          '<div class="card-title">' + stData.title + '</div>' +
          '<div class="card-desc">' + stData.hint + '</div>' +
          '<div class="card-bottom">' + btnHtml + '</div>';

        grid.appendChild(card);
      }

      var victory = document.getElementById('victory-screen');
      if (unlocked.length === STATIONS.length) {
        victory.style.display = 'block';
      } else {
        victory.style.display = 'none';
      }
    }

    function openInputModal(id) {
      for (var i = 0; i < STATIONS.length; i++) {
        if (STATIONS[i].id === id) { activeStation = STATIONS[i]; break; }
      }
      var t = I18N[currentLang] || I18N.sk;
      var hero = t.heroes[activeStation.role];
      document.getElementById('modal-station-title').textContent = hero + ' - ' + t.station + ' #' + activeStation.id;
      document.getElementById('code-input').value = '';
      document.getElementById('modal').className = 'modal-overlay active';
      document.getElementById('code-input').focus();
    }

    function closeInputModal() {
      document.getElementById('modal').className = 'modal-overlay';
      activeStation = null;
    }

    function openFactModal(id) {
      var idx = -1;
      for (var i = 0; i < STATIONS.length; i++) {
        if (STATIONS[i].id === id) { idx = i; break; }
      }
      if (idx === -1) return;

      var st = STATIONS[idx];
      var t = I18N[currentLang] || I18N.sk;
      var stData = t.stations[idx];

      var icons = { fire: '🔥', med: '🚑', pol: '🚓' };
      document.getElementById('fact-icon').textContent = icons[st.role] || '🎖️';
      document.getElementById('fact-title').textContent = stData.factTitle;
      document.getElementById('fact-desc').textContent = stData.factText;

      document.getElementById('fact-modal').className = 'modal-overlay active';
    }

    function closeFactModal() {
      document.getElementById('fact-modal').className = 'modal-overlay';
    }

    function verifyCode() {
      if (!activeStation) return;
      var val = document.getElementById('code-input').value.replace(/\s+/g, '').toUpperCase();
      
      // Overenie, či zadané písmeno patrí k tomuto stanovišťu (SK aj HU)
      if (activeStation.validKeys.indexOf(val) !== -1) {
        var sid = activeStation.id;
        unlock(sid);
        closeInputModal();
        openFactModal(sid);
      } else {
        alert(I18N[currentLang].wrongCode);
      }
    }

    function unlock(id) {
      if (unlocked.indexOf(id) === -1) {
        unlocked.push(id);
        try { localStorage.setItem('unlocked_stations', JSON.stringify(unlocked)); } catch(e) {}
        renderAll();
      }
    }

    function checkUrlParams() {
      var query = window.location.search.substring(1);
      if (!query) return;
      var vars = query.split('&');
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split('=');
        if (pair[0] === 'stamp') {
          var sid = parseInt(pair[1], 10);
          if (sid >= 1 && sid <= 6) {
            unlock(sid);
            openFactModal(sid);
          }
        }
      }
    }

    renderAll();
    checkUrlParams();
  </script>
</body>
</html>

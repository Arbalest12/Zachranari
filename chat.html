<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat s Redim</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .chat-container { width: 100%; max-width: 400px; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; }
        .chat-header { background: #2c2c2c; color: white; padding: 15px; text-align: center; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; border-bottom: 4px solid #e63946;}
        .chat-header img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background-color: white;}
        .chat-box { height: 350px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #fdfdfd; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.4; font-size: 15px; }
        .bot-msg { background: #ffe3e4; border-bottom-left-radius: 2px; align-self: flex-start; color: #2c2c2c; border-left: 3px solid #e63946;}
        .user-msg { background: #457b9d; color: white; border-bottom-right-radius: 2px; align-self: flex-end; }
        .input-area { display: flex; padding: 10px; background: #eee; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { background: #e63946; color: white; border: none; padding: 10px 18px; margin-left: 10px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 16px; }
        .typing { font-size: 0.8em; color: #888; font-style: italic; display: none; padding-left: 15px;}
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <!-- Odkaz priamo na vášho maskota v zložke -->
        <img src="Redi.png" alt="Hasič Redi">
        <span>Hasič Redi</span>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-msg">Ahoj! Ja som Redi, tvoj hasičský kamarát. 🚒 Ako ti dnes môžem pomôcť?</div>
    </div>
    <div class="typing" id="typingIndicator">Redi ti píše odpoveď...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Napíš niečo Redimu..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    // SEM VLOŽTE URL ADRESU Z GOOGLE APPS SCRIPTU, KTORÚ STE ZÍSKALI V KROKU 1
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwm_3K66tP1gEgNB5absiTQ2BcPTChBNYrbeuSq0roUvJTQ9rn6rm-Ahj45WRC1C2vp/exec";

    // Funkcia na prečítanie odpovede (Native Text-to-Speech)
    function speak(text) {
        if ('speechSynthesis' in window) {
            // Pred čítaním odstránime emotikony, aby ich telefón nečítal nahlas (napr. "Smajlík hasičské auto")
            const textToSpeak = text.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '');
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'sk-SK'; 
            utterance.rate = 1.15; // Mierne zrýchlené pre plynulosť
            utterance.pitch = 1.3;  // Jemne vyšší a hravejší hlas pre postavičku
            window.speechSynthesis.speak(utterance);
        }
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, "user-msg");
        input.value = "";
        
        const typing = document.getElementById("typingIndicator");
        typing.style.display = "block";
        const chatBox = document.getElementById("chatBox");
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Použitie text/plain, aby sme obišli zbytočné blokovanie v prehliadači pri dopytovaní Apps Scriptu
            const response = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ message: message })
            });
            
            const data = await response.json();
            typing.style.display = "none";
            addMessage(data.reply, "bot-msg");
            
            // Po pridaní textu na obrazovku ho Redi prečíta nahlas
            speak(data.reply);

        } catch (error) {
            typing.style.display = "none";
            addMessage("Moja vysielačka stratila signál, skús mi napísať znova! 📻", "bot-msg");
        }
    }

    function addMessage(text, className) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = "message " + className;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>

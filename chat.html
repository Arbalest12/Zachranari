<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasič Redi - Chat</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 95vh;
    }
    .chat-container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 85vh;
      max-height: 680px;
    }
    .chat-header {
      background: #2b2b2b;
      color: white;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid #e63946;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #fff;
      object-fit: cover;
      background: #fff;
    }
    .chat-header h2 {
      margin: 0;
      font-size: 1.25rem;
    }
    .tts-toggle {
      background: #444;
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .tts-toggle.active {
      background: #2a9d8f;
    }
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 1rem;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .bot-message {
      background: #ffe3e3;
      color: #2b2b2b;
      align-self: flex-start;
      border-left: 4px solid #e63946;
      border-bottom-left-radius: 4px;
    }
    .user-message {
      background: #3d708f;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .typing-indicator {
      font-style: italic;
      color: #777;
      font-size: 0.9rem;
      padding: 0 18px 8px;
      display: none;
    }
    .chat-input-area {
      padding: 10px 12px;
      background: #eee;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .chat-input-area input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 1rem;
      outline: none;
    }
    .btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .btn:active {
      transform: scale(0.92);
    }
    .mic-btn {
      background: #2a9d8f;
    }
    .mic-btn.listening {
      background: #e63946;
      animation: pulse 1.2s infinite;
    }
    .send-btn {
      background: #e63946;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(230, 57, 70, 0); }
      100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0); }
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="header-left">
      <img src="Redi.png" alt="Redi">
      <h2>Hasič Redi</h2>
    </div>
    <button id="ttsToggle" class="tts-toggle active" title="Zapnúť/Vypnúť hlas Rediho">🔊</button>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="message bot-message">
      Ahoj! Ja som Redi, tvoj hasičský kamarát. 🚒 Stlač zelený mikrofón a povedz mi, čo ťa zaujíma!
    </div>
  </div>

  <div class="typing-indicator" id="typingIndicator">Redi ti píše odpoveď...</div>

  <div class="chat-input-area">
    <button class="btn mic-btn" id="micBtn" title="Povedz to Redimu">🎤</button>
    <input type="text" id="userInput" placeholder="Napíš alebo povedz...">
    <button class="btn send-btn" id="sendBtn" title="Odoslať">➤</button>
  </div>
</div>

<script>
  // SEM VLOŽTE VAŠU FUNKČNÚ URL ADRESU Z APPS SCRIPTU:
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwdDrxIGyQdTlGFB7XuAAN2lvHX5M8P6nYvbWU16NQ1MZyVMyotM277vhWoSTZpxo5u/exec";

  const chatMessages = document.getElementById('chatMessages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const ttsToggle = document.getElementById('ttsToggle');
  const typingIndicator = document.getElementById('typingIndicator');

  let voiceEnabled = true;

  // Prepínanie hlasového čítania (Reproduktor v hlavičke)
  ttsToggle.addEventListener('click', () => {
    voiceEnabled = !voiceEnabled;
    ttsToggle.textContent = voiceEnabled ? '🔊' : '🔇';
    ttsToggle.classList.toggle('active', voiceEnabled);
    if (!voiceEnabled && 'speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  });

  // Funkcia na prečítanie odpovede nahlas (bez emotikonov)
  function speakText(text) {
    if (!voiceEnabled || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    // Odstránenie emotikonov, aby ich hlas nečítal slovom
    const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');

    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'sk-SK';
    utterance.rate = 1.0;
    utterance.pitch = 1.1; // Trochu vyšší, priateľskejší tón pre deti
    window.speechSynthesis.speak(utterance);
  }

  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
    msgDiv.textContent = text;
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    userInput.value = '';
    userInput.placeholder = 'Napíš alebo povedz...';
    typingIndicator.style.display = 'block';
    chatMessages.scrollTop = chatMessages.scrollHeight;

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ message: text })
      });
      const data = await response.json();
      typingIndicator.style.display = 'none';
      
      const reply = data.reply || "Prepáč, nerozumel som.";
      addMessage(reply, 'bot');
      speakText(reply); // Redi prečíta odpoveď nahlas
    } catch (error) {
      typingIndicator.style.display = 'none';
      addMessage("Moja vysielačka stratila signál, skús mi napísať znova! 📻", 'bot');
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // Nastavenie mikrofónu (Rozpoznávanie reči v slovenčine)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'sk-SK';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    let isListening = false;

    micBtn.addEventListener('click', () => {
      if (isListening) {
        recognition.stop();
      } else {
        // Pri nahrávaní stíšime Rediho, ak práve rozpráva
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        recognition.start();
      }
    });

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      userInput.placeholder = "Počúvam ťa, hovor...";
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      userInput.value = transcript;
      sendMessage(); // Automaticky odošle to, čo dieťa povedalo
    };

    recognition.onerror = (event) => {
      console.error("Chyba mikrofónu:", event.error);
      userInput.placeholder = "Skús stlačiť mikrofón znova...";
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      if (userInput.placeholder === "Počúvam ťa, hovor...") {
        userInput.placeholder = "Napíš alebo povedz...";
      }
    };
  } else {
    // Ak prehliadač nepodporuje mikrofón, tlačidlo sa skryje
    micBtn.style.display = 'none';
  }
</script>

</body>
</html>

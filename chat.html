<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hasič Redi - Chat</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 95vh;
    }
    .chat-container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 88vh;
      max-height: 680px;
    }
    .chat-header {
      background: #2b2b2b;
      color: white;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid #e63946;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .chat-header img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #fff;
      object-fit: cover;
      background: #fff;
      flex-shrink: 0;
    }
    .chat-header h2 {
      margin: 0;
      font-size: 1.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .lang-toggle {
      background: #444;
      border: 1px solid #666;
      color: white;
      padding: 6px 10px;
      border-radius: 15px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .tts-toggle {
      background: #444;
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .tts-toggle.active {
      background: #2a9d8f;
    }
    .chat-messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 84%;
      padding: 12px 15px;
      border-radius: 18px;
      font-size: 0.98rem;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .bot-message {
      background: #ffe3e3;
      color: #2b2b2b;
      align-self: flex-start;
      border-left: 4px solid #e63946;
      border-bottom-left-radius: 4px;
    }
    .user-message {
      background: #3d708f;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .typing-indicator {
      font-style: italic;
      color: #777;
      font-size: 0.9rem;
      padding: 0 16px 8px;
      display: none;
    }
    .chat-input-area {
      padding: 8px 10px;
      background: #eee;
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }
    .chat-input-area input {
      flex: 1;
      min-width: 0; /* Zabraňuje vytlačeniu pravého tlačidla mimo obrazovku */
      padding: 11px 14px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 0.95rem;
      outline: none;
    }
    .btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .btn:active {
      transform: scale(0.92);
    }
    .mic-btn {
      background: #2a9d8f;
    }
    .mic-btn.listening {
      background: #e63946;
      animation: pulse 1.2s infinite;
    }
    .send-btn {
      background: #e63946;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(230, 57, 70, 0); }
      100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0); }
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="header-left">
      <img src="Redi.png" alt="Redi">
      <h2 id="headerTitle">Hasič Redi</h2>
    </div>
    <div class="header-controls">
      <button id="langToggle" class="lang-toggle" title="Zmeniť jazyk / Nyelvváltás">🇭🇺 HU</button>
      <button id="ttsToggle" class="tts-toggle active" title="Zapnúť/Vypnúť hlas">🔊</button>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="message bot-message" id="welcomeMsg">
      Ahoj! Ja som Redi, tvoj hasičský kamarát. 🚒 Stlač zelený mikrofón a povedz mi, čo ťa zaujíma!
    </div>
  </div>

  <div class="typing-indicator" id="typingIndicator">Redi ti píše odpoveď...</div>

  <div class="chat-input-area">
    <button class="btn mic-btn" id="micBtn" title="Mikrofón">🎤</button>
    <input type="text" id="userInput" placeholder="Napíš alebo povedz...">
    <button class="btn send-btn" id="sendBtn" title="Odoslať">➤</button>
  </div>
</div>

<script>
  // SEM VLOŽTE VAŠU FUNKČNÚ URL ADRESU Z APPS SCRIPTU:
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYqDdtrI0a1b_FBOeY-GguqntQccHemCK6yyRNFPdfZQtLIS3GLgV5_eJLy9KIu8MO/exec";

  const chatMessages = document.getElementById('chatMessages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const ttsToggle = document.getElementById('ttsToggle');
  const langToggle = document.getElementById('langToggle');
  const headerTitle = document.getElementById('headerTitle');
  const welcomeMsg = document.getElementById('welcomeMsg');
  const typingIndicator = document.getElementById('typingIndicator');

  let voiceEnabled = true;

  const translations = {
    sk: {
      title: "Hasič Redi",
      welcome: "Ahoj! Ja som Redi, tvoj hasičský kamarát. 🚒 Stlač zelený mikrofón a povedz mi, čo ťa zaujíma!",
      placeholder: "Napíš alebo povedz...",
      listening: "Počúvam ťa, hovor...",
      micRetry: "Skús stlačiť mikrofón znova...",
      typing: "Redi ti píše odpoveď...",
      errorSignal: "Moja vysielačka stratila signál, skús mi napísať znova! 📻",
      speechLang: "sk-SK",
      nextLangBtn: "🇭🇺 HU"
    },
    hu: {
      title: "Redi tűzoltó",
      welcome: "Szia! Redi vagyok, a tűzoltó barátod. 🚒 Nyomd meg a zöld mikrofont, és mondd el, mi érdekel!",
      placeholder: "Írj vagy beszélj...",
      listening: "Hallgatlak, beszélj...",
      micRetry: "Próbáld meg újra megnyomni a mikrofont...",
      typing: "Redi válaszol...",
      errorSignal: "Elment a rádiójelem, próbálj meg újra írni! 📻",
      speechLang: "hu-HU",
      nextLangBtn: "🇸🇰 SK"
    }
  };

  const urlParams = new URLSearchParams(window.location.search);
  let currentLang = urlParams.get('lang') === 'hu' ? 'hu' : 'sk';

  function applyLanguage() {
    const t = translations[currentLang];
    headerTitle.textContent = t.title;
    welcomeMsg.textContent = t.welcome;
    userInput.placeholder = t.placeholder;
    typingIndicator.textContent = t.typing;
    langToggle.textContent = t.nextLangBtn;
    if (recognition) {
      recognition.lang = t.speechLang;
    }
  }

  langToggle.addEventListener('click', () => {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    currentLang = currentLang === 'sk' ? 'hu' : 'sk';
    applyLanguage();
  });

  ttsToggle.addEventListener('click', () => {
    voiceEnabled = !voiceEnabled;
    ttsToggle.textContent = voiceEnabled ? '🔊' : '🔇';
    ttsToggle.classList.toggle('active', voiceEnabled);
    if (!voiceEnabled && 'speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  });

  function speakText(text) {
    if (!voiceEnabled || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');

    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = translations[currentLang].speechLang;
    utterance.rate = 1.0;
    utterance.pitch = 1.1;
    window.speechSynthesis.speak(utterance);
  }

  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
    msgDiv.textContent = text;
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    userInput.value = '';
    userInput.placeholder = translations[currentLang].placeholder;
    typingIndicator.style.display = 'block';
    chatMessages.scrollTop = chatMessages.scrollHeight;

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ message: text, lang: currentLang })
      });
      const data = await response.json();
      typingIndicator.style.display = 'none';
      
      const reply = data.reply || "...";
      addMessage(reply, 'bot');
      speakText(reply);
    } catch (error) {
      typingIndicator.style.display = 'none';
      addMessage(translations[currentLang].errorSignal, 'bot');
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = translations[currentLang].speechLang;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    let isListening = false;

    micBtn.addEventListener('click', () => {
      if (isListening) {
        recognition.stop();
      } else {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        recognition.lang = translations[currentLang].speechLang;
        recognition.start();
      }
    });

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      userInput.placeholder = translations[currentLang].listening;
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      userInput.value = transcript;
      sendMessage();
    };

    recognition.onerror = (event) => {
      console.error("Chyba mikrofónu:", event.error);
      userInput.placeholder = translations[currentLang].micRetry;
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      if (userInput.placeholder === translations[currentLang].listening) {
        userInput.placeholder = translations[currentLang].placeholder;
      }
    };
  } else {
    micBtn.style.display = 'none';
  }

  applyLanguage();
</script>

</body>
</html>
